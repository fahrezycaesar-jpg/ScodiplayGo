<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScodiplayApps — Download</title>
  <meta name="description" content="Download ScodiplayApps. Mari mulai berkoneksi dengan kami." />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0b0713;
      overflow: hidden;
      position: relative;
      color: #fff;
    }

    /* ==== Latar belakang animasi ==== */
    .bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      animation: float 14s ease-in-out infinite;
      pointer-events: none;
    }
    .blob1 {
      width: 420px; height: 420px;
      background: #7c3aed;
      top: -120px; left: -100px;
    }
    .blob2 {
      width: 380px; height: 380px;
      background: #06b6d4;
      bottom: -140px; right: -90px;
      animation-delay: -5s;
    }
    .blob3 {
      width: 300px; height: 300px;
      background: #ec4899;
      top: 45%; left: 55%;
      animation-delay: -9s;
      opacity: 0.35;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(40px, -50px) scale(1.12); }
      66%      { transform: translate(-35px, 30px) scale(0.92); }
    }

    /* ==== Kartu utama ==== */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      padding: 44px 32px 36px;
      border-radius: 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
      animation: appear 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ==== Ikon aplikasi ==== */
    .app-icon {
      width: 104px;
      height: 104px;
      margin: 0 auto 24px;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #8b5cf6, #06b6d4);
      box-shadow: 0 16px 40px rgba(124, 58, 237, 0.5),
                  inset 0 1px 0 rgba(255, 255, 255, 0.4);
      animation: pulse 3.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-9px); }
    }
    .app-icon svg {
      width: 54px;
      height: 54px;
      stroke: #fff;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ==== Teks ==== */
    .app-name {
      font-size: 1.95rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fff, #c4b5fd, #67e8f9);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .app-desc {
      font-size: 1rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.72);
      max-width: 290px;
      margin: 0 auto 26px;
    }

    .meta {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 100px;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.13);
    }

    /* ==== Tombol download ==== */
    .btn-download {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      width: 100%;
      padding: 18px 24px;
      font-size: 1.06rem;
      font-weight: 700;
      font-family: inherit;
      color: #fff;
      text-decoration: none;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      overflow: hidden;
      background: linear-gradient(135deg, #8b5cf6, #6366f1 45%, #06b6d4);
      background-size: 200% 200%;
      box-shadow: 0 14px 34px rgba(99, 102, 241, 0.45);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      animation: shine 6s linear infinite;
    }
    @keyframes shine {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .btn-download:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 44px rgba(99, 102, 241, 0.62);
    }
    .btn-download:active {
      transform: translateY(-1px) scale(0.985);
    }
    .btn-download svg {
      width: 22px;
      height: 22px;
      stroke: #fff;
      stroke-width: 2.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Efek kilau melintas */
    .btn-download::after {
      content: '';
      position: absolute;
      top: 0; left: -120%;
      width: 60%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
      transform: skewX(-22deg);
      animation: sweep 3.4s ease-in-out infinite;
    }
    @keyframes sweep {
      0%   { left: -120%; }
      55%  { left: 130%; }
      100% { left: 130%; }
    }

    /* ==== Catatan keamanan ==== */
    .note {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-top: 24px;
      padding: 13px 15px;
      border-radius: 14px;
      font-size: 0.76rem;
      line-height: 1.55;
      text-align: left;
      color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
    .note svg {
      flex-shrink: 0;
      width: 15px; height: 15px;
      margin-top: 2px;
      stroke: #67e8f9;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .footer {
      margin-top: 22px;
      font-size: 0.7rem;
      letter-spacing: 0.6px;
      color: rgba(255, 255, 255, 0.32);
    }

    /* ==== Status saat diklik ==== */
    .btn-download.loading {
      pointer-events: none;
      opacity: 0.8;
    }
    .btn-download.loading svg {
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 420px) {
      .card { padding: 36px 22px 30px; border-radius: 26px; }
      .app-name { font-size: 1.65rem; }
      .app-icon { width: 90px; height: 90px; border-radius: 23px; }
      .app-icon svg { width: 46px; height: 46px; }
      .btn-download { padding: 16px 20px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- Latar belakang -->
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>
  <div class="bg-blob blob3"></div>

  <!-- Kartu utama -->
  <main class="card">

    <!-- Ikon aplikasi -->
    <div class="app-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z" />
        <path d="m3 7 9 5 9-5" />
        <path d="M12 12v10" />
      </svg>
    </div>

    <!-- Nama aplikasi -->
    <h1 class="app-name">ScodiplayApps</h1>

    <!-- Deskripsi -->
    <p class="app-desc">mari mulai berkoneksi dengan kami</p>

    <!-- Info singkat (TANPA versi) -->
    <div class="meta">
      <span class="badge">Android</span>
      <span class="badge">APK</span>
    </div>

    <!-- ==============================================
         TOMBOL DOWNLOAD
         File APK harus bernama: ScodiplayApps.apk
         dan diletakkan di folder yang sama dengan index.html
         ============================================== -->
    <a
      id="downloadBtn"
      class="btn-download"
      href="scodiplayApps_v1.0.3_1794714308926.apk"
      download="scodiplayApps_v1.0.3_1794714308926.apk"
      type="application/vnd.android.package-archive"
    >
      <svg id="btnIcon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <path d="m7 10 5 5 5-5" />
        <path d="M12 15V3" />
      </svg>
      <span id="btnText">Download APK</span>
    </a>

    <!-- Catatan -->
    <div class="note">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
        <path d="m9 12 2 2 4-4" />
      </svg>
      <span>
        Jika muncul peringatan saat instalasi, aktifkan
        <strong>“Install from unknown sources”</strong> di pengaturan
        keamanan perangkat kamu.
      </span>
    </div>

    <p class="footer">© 2026 ScodiplayApps</p>

  </main>

  <script>
    const btn  = document.getElementById('downloadBtn');
    const text = document.getElementById('btnText');

    btn.addEventListener('click', function () {
      btn.classList.add('loading');
      text.textContent = 'Mengunduh...';

      setTimeout(function () {
        btn.classList.remove('loading');
        text.textContent = 'Download APK';
      }, 3000);
    });
  </script>

</body>
</html>
